<ng-container [formGroup]="formGroup()">
  <fieldset [formArrayName]="formArrayName()">
    <legend>
      {{ fieldSetName() ? fieldSetName() : (formArrayName() | titlecase) }}
    </legend>
    @for (label of labels(); track $index) {
      <p-floatlabel>
        <label [htmlFor]="`input-${$index}`">{{ label }}</label>
        <input pInputText type="text" [formControlName]="$index" [id]="`input-${$index}`"/>
      </p-floatlabel>
    }
  </fieldset>
</ng-container>
